# Every commit on a pull request must carry a Signed-off-by line (git commit -s). See CONTRIBUTING.md.
name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done
          exit $missing
