# Every commit on a pull request, and every commit pushed to main, must carry a Signed-off-by line (git commit -s).
# See CONTRIBUTING.md.
name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          case "$base" in
            ""|0000000000000000000000000000000000000000) commits=$(git rev-list --max-count=100 "$head") ;;
            *) commits=$(git rev-list "$base..$head") ;;
          esac
          [ -n "$commits" ] || { echo "::error::no commits to check"; exit 1; }
          missing=0
          for c in $commits; do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done
          exit $missing
